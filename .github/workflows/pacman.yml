name: Generate Pac-Man Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Ejecuta la acción todos los días a medianoche (UTC)
  workflow_dispatch:  # Permite ejecutarlo manualmente desde "Actions" en GitHub
  push:
    branches:
      - main  # Se ejecuta cuando haces un push a la rama "main"

jobs:
  generate:
    runs-on: ubuntu-latest  # Usa una máquina virtual con Ubuntu
    timeout-minutes: 10  # Límite de ejecución de 10 minutos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pillow

      - name: Generate Pac-Man GIF
        run: python generate_pacman.py

      - name: Set up Git for authentication
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          echo "https://${GITHUB_TOKEN}@github.com" > ~/.git-credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Usamos el GITHUB_TOKEN de GitHub Actions
          publish_dir: .
          publish_branch: output
          commit_message: "Update Pac-Man animation [skip ci]"
