name: Generate Pac-Man Animation  # Nombre del workflow

on:
  schedule:
    - cron: "0 0 * * *"  # Ejecuta la acción todos los días a medianoche (UTC)
  workflow_dispatch:  # Permite ejecutarlo manualmente desde "Actions" en GitHub
  push:
    branches:
      - main  # Se ejecuta cuando haces un push a la rama "main"

jobs:
  generate:
    runs-on: ubuntu-latest  # Usa una máquina virtual con Ubuntu
    timeout-minutes: 10  # Límite de ejecución de 10 minutos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        # Descarga tu código en la máquina virtual de GitHub

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'
        # Instala Python para ejecutar el script de Pac-Man

      - name: Install Dependencies
        run: pip install pillow
        # Instala la librería Pillow para trabajar con imágenes

      - name: Generate Pac-Man GIF
        run: python generate_pacman.py
        # Ejecuta el script en Python que genera el GIF animado de Pac-Man

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: output
          commit_message: "Update Pac-Man animation [skip ci]"
        # Sube el archivo `pacman.gif` a la rama `output`
